services:
  - type: web
    name: charles-beauty
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 2 --timeout 500 --graceful-timeout 30
    envVars:
      - key: FLASK_ENV
        value: production
      - key: DATA_DIR
        value: /data
    disk:
      name: charles-data
      mountPath: /data
      sizeGB: 1