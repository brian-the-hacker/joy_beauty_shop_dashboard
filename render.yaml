services:
  - type: web
    name: charles-beauty
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 2 --timeout 60
    envVars:
      - key: FLASK_ENV
        value: production
      - key: DATA_DIR
        value: /data          # matches the disk mountPath below
    disk:
      name: charles-data
      mountPath: /data        # products.json lives here — survives every redeploy
      sizeGB: 1